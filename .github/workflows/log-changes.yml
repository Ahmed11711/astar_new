name: Daily Push Logger

on:
  push:
    branches:
      - master  
    workflow_dispatch:


jobs:
  log-changes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Append changes to log
        run: |
          LOG_FILE="daily_activity_log.md"
          TODAY=$(date +'%Y-%m-%d')
          echo "## $TODAY" >> $LOG_FILE
          echo "" >> $LOG_FILE
          echo "### Commits pushed today:" >> $LOG_FILE
          git log -1 --pretty=format:"- %h %s (%an)" >> $LOG_FILE
          echo "" >> $LOG_FILE

      - name: Auto Commit Log
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "🤖 Update daily activity log"
          branch: main
          add: 'daily_activity_log.md'
